<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DHAROHAR" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#ef7624" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>DHAROHAR (धरोहर / ధరోహర్) — Family, POUROHITHYAM & Agriculture Management</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --saffron: #ef7624;
      --deep-orange: #d95d13;
      --ivory: #fff9ef;
      --white: #ffffff;
      --deep-green: #176b3a;
      --forest-dark: #0d4829;
      --soft-green: #e8f3e7;
      --gold: #c69a45;
      --maroon: #7a1f2b;
      --charcoal: #26332b;
      --muted: #6e736a;
      --line: #eadfce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #f6efe4;
      color: var(--charcoal);
      font-family: Inter, "Noto Sans Telugu", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .serif-title { font-family: Georgia, "Noto Serif", "Noto Sans Telugu", serif; }
    .app-shell {
      max-width: 1120px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: var(--ivory);
      box-shadow: 0 0 60px rgba(91, 57, 18, 0.10);
      position: relative;
      padding-bottom: 92px;
    }
    .top-pattern {
      height: 4px;
      background: linear-gradient(90deg, #ef7624 0% 34%, #c69a45 34% 66%, #176b3a 66% 100%);
    }
    .topbar {
      height: 68px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #f0e9de;
      position: sticky;
      top: 0;
      z-index: 35;
    }
    .hero-card {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 90% 10%, rgba(255,255,255,0.16) 0 2px, transparent 3px),
                  radial-gradient(circle at 12% 95%, rgba(255,255,255,0.12) 0 2px, transparent 3px),
                  linear-gradient(125deg, #f18a35 0%, #e65e16 62%, #c94b12 100%);
      border-radius: 26px;
      padding: 28px 30px;
      color: #fff;
      box-shadow: 0 16px 32px rgba(216, 107, 37, 0.24);
    }
    .hero-card::before, .hero-card::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-card::before { width: 260px; height: 260px; right: -70px; top: -130px; }
    .hero-card::after { width: 190px; height: 190px; right: -35px; top: -95px; border-style: dashed; }
    .hero-om {
      position: absolute;
      right: 5%;
      bottom: -26px;
      font-size: 145px;
      opacity: 0.12;
      transform: rotate(-12deg);
      pointer-events: none;
      line-height: 1;
    }
    .heritage-card {
      background: var(--white);
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 7px 18px rgba(73, 48, 12, 0.05);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }
    .clickable-card { cursor: pointer; }
    .clickable-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(76, 49, 20, 0.10);
      border-color: #d9bd8d;
    }
    .profile-card { position: relative; overflow: hidden; }
    .profile-card::after {
      content: attr(data-motif);
      position: absolute;
      right: 8px;
      bottom: -14px;
      font-size: 80px;
      opacity: 0.07;
      pointer-events: none;
      line-height: 1;
    }
    .overview-forest {
      background: linear-gradient(115deg, #155c35, #0d4829);
      border-radius: 22px;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 26px rgba(22, 77, 48, 0.22);
    }
    .overview-forest::after {
      content: "❋";
      position: absolute;
      right: 10px;
      top: -32px;
      font-size: 140px;
      color: rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }
    .btn-primary {
      background-color: var(--saffron);
      color: #fff;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 13px;
      font-weight: 700;
      font-size: 14px;
      border: 0;
      cursor: pointer;
    }
    .btn-primary:hover { background-color: var(--deep-orange); }
    .btn-green {
      background-color: var(--deep-green);
      color: #fff;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 13px;
      font-weight: 700;
      font-size: 14px;
      border: 0;
      cursor: pointer;
    }
    .btn-green:hover { background-color: #11552e; }
    .btn-gold-cream {
      border: 1.5px solid #e5c783;
      background: #f7e8c7;
      color: #214a2e;
      min-height: 44px;
      padding: 9px 18px;
      border-radius: 13px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-outline {
      border: 1.5px solid #dfd3c3;
      color: var(--charcoal);
      background: #fff;
      min-height: 42px;
      padding: 7px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-outline:hover { border-color: var(--gold); background: #fffcf7; }
    .input-field {
      width: 100%;
      min-height: 46px;
      padding: 10px 13px;
      border-radius: 12px;
      border: 1.5px solid #dfd3c3;
      background: #fff;
      font-size: 15px;
      color: var(--charcoal);
    }
    .input-field:focus {
      outline: none;
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px rgba(239, 118, 36, 0.15);
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1120px;
      height: 74px;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 7vw, 88px);
      z-index: 40;
      box-shadow: 0 -6px 20px rgba(73, 48, 12, 0.05);
    }
    .toast-bar {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: #26332b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.24);
    }
    .cal-cell {
      min-height: 52px;
      border-radius: 12px;
      border: 1px solid #f0e7da;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .cal-cell:hover { border-color: #ef7624; background: #fff7ee; }
    .cal-cell.today { border: 2px solid #ef7624; background: #fff3e6; font-weight: 800; }
    .cal-cell.selected { background: #176b3a; color: #fff; border-color: #176b3a; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(38, 51, 43, 0.54);
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) { .modal-backdrop { align-items: center; } }
    .modal-sheet {
      background: var(--ivory);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 24px 24px 0 0;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    @media (min-width: 640px) { .modal-sheet { border-radius: 24px; } }
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(180deg, #fff9ef 0%, #fff2dc 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 48px 24px 44px;
      transition: opacity 0.4s ease;
    }
    #splash-screen.fade-out { opacity: 0; pointer-events: none; }
    .splash-spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(239, 118, 36, 0.25);
      border-top-color: #ef7624;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pin-code-input::placeholder { color: rgba(38, 51, 43, 0.40); opacity: 1; font-weight: 700; letter-spacing: 3px; }

    .analytics-dark { background: transparent; color: #26332b; border-radius: 0; border: 0; }
    .analytics-card { background: #ffffff; border: 1px solid #eadfce; border-radius: 18px; box-shadow: 0 2px 10px rgba(38, 51, 43, 0.04); }
    .analytics-pill { background: #ffffff; color: #5b635b; border: 1px solid #dfd3c3; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .analytics-pill.active { background: #176b3a; color: #ffffff; border-color: #176b3a; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @media print {
      .top-pattern, .topbar, .bottom-nav, #toast-root, #modal-root, #splash-screen, button, select, label.btn-outline { display: none !important; }
      body { background: #ffffff !important; padding-bottom: 0 !important; }
      .heritage-card, .analytics-card { box-shadow: none !important; break-inside: avoid; }
    }

    .phone-num { font-size: 1.15em; font-weight: 700; letter-spacing: 0.3px; }

    @supports (padding-top: env(safe-area-inset-top)) {
      .top-pattern { padding-top: env(safe-area-inset-top); }
      .bottom-nav { padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important; }
      body { padding-bottom: calc(84px + env(safe-area-inset-bottom)) !important; }
    }
  </style>
</head>

    // ==================== MONEY, DATES & TIMELINE ====================
    function rupeesToPaise(val) {
      const cleaned = String(val || "").replace(/,/g, "").trim();
      if (!cleaned) return 0;
      const num = Number(cleaned);
      if (!Number.isFinite(num) || num < 0) return NaN;
      return Math.round(num * 100);
    }

    function formatInr(paise) {
      const safe = Number.isFinite(paise) ? Math.round(paise) : 0;
      const neg = safe < 0;
      const absP = Math.abs(safe);
      const rupees = Math.floor(absP / 100);
      const rem = absP % 100;
      return (neg ? "-" : "") + "₹" + rupees.toLocaleString("en-IN") + (rem > 0 ? "." + String(rem).padStart(2, "0") : "");
    }

    function todayIso() { return new Date().toISOString().slice(0, 10); }

    function daysBetween(startIso, endIso) {
      if (!startIso || !endIso) return 0;
      const s = new Date(startIso + "T00:00:00");
      const e = new Date(endIso + "T00:00:00");
      if (isNaN(s.getTime()) || isNaN(e.getTime())) return 0;
      return Math.round((e - s) / (1000 * 60 * 60 * 24));
    }

    function formatDayDelta(isoDate) {
      if (!isoDate) return "";
      const diff = daysBetween(todayIso(), isoDate);
      if (state.lang === "te") {
        if (diff === 0) return "ఈ రోజు";
        if (diff > 0) return `${diff} రోజుల్లో`;
        return `${Math.abs(diff)} రోజుల క్రితం`;
      }
      if (diff === 0) return "Today";
      if (diff > 0) return `In ${diff} day${diff === 1 ? "" : "s"}`;
      return `${Math.abs(diff)} day${Math.abs(diff) === 1 ? "" : "s"} ago`;
    }

    function validateTimeline(startIso, endIso, startLabel, endLabel) {
      if (!startIso) return `${startLabel} is required.`;
      const sy = Number(startIso.slice(0, 4));
      if (sy < 1990 || sy > 2100) return `${startLabel} year looks invalid.`;
      if (endIso) {
        const ey = Number(endIso.slice(0, 4));
        if (ey < 1990 || ey > 2100) return `${endLabel} year looks invalid.`;
        if (endIso < startIso) return `Timeline error: ${endLabel} (${endIso}) cannot be earlier than ${startLabel} (${startIso}).`;
      }
      return null;
    }

    function addMonthsIso(isoDate, monthsToAdd) {
      const parts = isoDate.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const targetMonth = d.getMonth() + monthsToAdd;
      const targetYear = d.getFullYear() + Math.floor(targetMonth / 12);
      const normMonth = ((targetMonth % 12) + 12) % 12;
      const maxDay = new Date(targetYear, normMonth + 1, 0).getDate();
      const day = Math.min(parts[2], maxDay);
      return `${targetYear}-${String(normMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function generateRecurringLoanDueDates(loan) {
      if (!loan.startDate) return [];
      const dates = [];
      const endLimit = loan.dueDate && loan.dueDate >= loan.startDate ? loan.dueDate : addMonthsIso(loan.startDate, 12);
      const stepMonths = loan.ratePeriod === "ANNUAL" ? 12 : 1;
      for (let i = 1; i <= 60; i++) {
        const nextDate = addMonthsIso(loan.startDate, i * stepMonths);
        if (nextDate > endLimit) break;
        dates.push(nextDate);
      }
      if (loan.dueDate && loan.dueDate >= loan.startDate && !dates.includes(loan.dueDate)) dates.push(loan.dueDate);
      return dates;
    }

    function calcLoanSummary(loan, repayments) {
      const loanReps = repayments.filter(r => r.loanId === loan.id);
      const rawInterestPaidPaise = loanReps.filter(r => (r.paymentType || "INTEREST") === "INTEREST").reduce((a, b) => a + b.amountPaise, 0);
      const directPrincipalPaidPaise = loanReps.filter(r => r.paymentType === "PRINCIPAL").reduce((a, b) => a + b.amountPaise, 0);
      const reducingPrincipalPaidPaise = loanReps.filter(r => r.paymentType === "PRINCIPAL" && r.reducePrincipal === true).reduce((a, b) => a + b.amountPaise, 0);
      const interestBasePrincipalPaise = Math.max(0, loan.principalPaise - reducingPrincipalPaidPaise);
      const elapsedDays = Math.max(0, daysBetween(loan.startDate, todayIso()));
      const isAnnual = loan.ratePeriod === "ANNUAL";
      const periodRate = loan.ratePercent / 100;

      // Calculate full loan term periods (Start Date -> Final Due Date) so Total Pending = Principal + Total Interest - Principal Paid - Interest Paid
      let totalPeriods = 0;
      if (loan.startDate && loan.dueDate && loan.dueDate >= loan.startDate) {
        const sp = loan.startDate.split("-").map(Number);
        const ep = loan.dueDate.split("-").map(Number);
        const exactMonths = Math.max(0, (ep[0] - sp[0]) * 12 + (ep[1] - sp[1]) + (ep[2] - sp[2]) / 30.4375);
        totalPeriods = isAnnual ? (exactMonths / 12) : exactMonths;
      } else {
        totalPeriods = isAnnual ? (elapsedDays / 365) : (elapsedDays / 30.4375);
      }

      const accruedInterestPaise = loan.interestType === "SIMPLE"
        ? Math.round(interestBasePrincipalPaise * periodRate * totalPeriods)
        : Math.max(0, Math.round(interestBasePrincipalPaise * (Math.pow(1 + periodRate, totalPeriods) - 1)));

      // Any interest paid above total term interest automatically deducts from Principal WITHOUT changing the interest base (fully reversible on Edit/Delete!)
      const interestPaidPaise = Math.min(rawInterestPaidPaise, accruedInterestPaise);
      const interestOverflowToPrincipalPaise = Math.max(0, rawInterestPaidPaise - accruedInterestPaise);
      const totalPrincipalPaidPaise = directPrincipalPaidPaise + interestOverflowToPrincipalPaise;
      const outPrincipalPaise = Math.max(0, loan.principalPaise - totalPrincipalPaidPaise);
      const outInterestPaise = Math.max(0, accruedInterestPaise - interestPaidPaise);
      const periodInterestPaise = Math.round(interestBasePrincipalPaise * periodRate);
      const monthlyInterestPaise = isAnnual ? Math.round(periodInterestPaise / 12) : periodInterestPaise;
      const annualInterestPaise = isAnnual ? periodInterestPaise : Math.round(periodInterestPaise * 12);
      const recurringDates = generateRecurringLoanDueDates(loan);
      const nextDueDate = recurringDates.find(d => d >= todayIso()) || loan.dueDate || "";

      return {
        interestPaidPaise, interestOverflowToPrincipalPaise, principalPaidPaise: totalPrincipalPaidPaise, interestBasePrincipalPaise, accruedInterestPaise, outInterestPaise, outPrincipalPaise,
        totalOutPaise: outPrincipalPaise + outInterestPaise,
        periodInterestPaise, monthlyInterestPaise, annualInterestPaise,
        periodLabel: isAnnual ? tr("Annual Int.", "వార్షిక వడ్డీ") : tr("Monthly Int.", "నెలవారీ వడ్డీ"),
        elapsedDays, recurringDates, nextDueDate
      };
    }

    // ==================== CONSOLIDATED COMPUTATION ====================
    function computeConsolidated() {
      const panditReceived = state.dakshinaPayments.reduce((s, p) => s + p.amountPaise, 0);
      const paidByBooking = {};
      state.dakshinaPayments.forEach(p => { paidByBooking[p.bookingId] = (paidByBooking[p.bookingId] || 0) + p.amountPaise; });
      const pendingDakshina = state.bookings.reduce((s, b) => s + Math.max(0, b.dakshinaCommittedPaise - (paidByBooking[b.id] || 0)), 0);

      const agriIncome = state.cropSales.reduce((s, c) => s + c.receivedPaise, 0);
      const wagePaidById = {};
      (state.agriWagePayments || []).forEach(wp => { wagePaidById[wp.wageId] = (wagePaidById[wp.wageId] || 0) + wp.amountPaise; });
      const agriWagesPaid = (state.agriWagePayments || []).reduce((s, wp) => s + wp.amountPaise, 0);
      const agriWagesPending = (state.agriWages || []).reduce((s, w) => s + Math.max(0, w.wagePaise - (wagePaidById[w.id] || 0)), 0);
      const agriExpense = state.agriExpenses.reduce((s, e) => s + e.amountPaise, 0) + agriWagesPaid;

      const personalIncome = state.personalTxns.filter(x => x.txnType === "INCOME").reduce((s, x) => s + x.amountPaise, 0);
      const personalExpense = state.personalTxns.filter(x => x.txnType === "EXPENSE").reduce((s, x) => s + x.amountPaise, 0);
      const personalSavings = state.personalTxns.filter(x => x.txnType === "SAVINGS").reduce((s, x) => s + x.amountPaise, 0);

      let borrowedOut = 0, lentOut = 0, loanProfitEarned = 0, loanInterestCost = 0;
      state.loans.forEach(l => {
        const calc = calcLoanSummary(l, state.loanRepayments);
        if (l.direction === "BORROWED") { borrowedOut += calc.totalOutPaise; loanInterestCost += calc.interestPaidPaise; }
        else { lentOut += calc.totalOutPaise; loanProfitEarned += calc.interestPaidPaise; }
      });

      const totalIncome = panditReceived + agriIncome + personalIncome + loanProfitEarned;
      const totalExpenses = agriExpense + personalExpense + loanInterestCost;
      return {
        totalIncome, totalExpenses, netCashFlow: totalIncome - totalExpenses,
        panditReceived, pendingDakshina, agriIncome, agriExpense, agriWagesPaid, agriWagesPending, wagePaidById,
        personalIncome, personalExpense, personalSavings,
        borrowedOut, lentOut, totalLoansOut: borrowedOut + lentOut,
        loanProfitEarned, loanInterestCost, paidByBooking,
        hasAnyData: (state.bookings.length + state.cropCycles.length + (state.agriWages || []).length + state.personalTxns.length + state.loans.length) > 0
      };
    }

    // ==================== 1. PANDIT SEVA SCREENS ====================
    function renderPandit(c) {
      const clients = [...new Set(state.bookings.map(b => b.clientName))];
      let list = state.panditFilterClient ? state.bookings.filter(b => b.clientName === state.panditFilterClient) : [...state.bookings];
      const remOf = b => Math.max(0, b.dakshinaCommittedPaise - (c.paidByBooking[b.id] || 0));
      if (state.panditSort === "DATE_DESC") list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      else if (state.panditSort === "DATE_ASC") list.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
      else if (state.panditSort === "CLIENT_ASC") list.sort((a, b) => a.clientName.localeCompare(b.clientName));
      else if (state.panditSort === "PENDING_FIRST") list.sort((a, b) => remOf(b) - remOf(a));
      else if (state.panditSort === "SETTLED_FIRST") list.sort((a, b) => remOf(a) - remOf(b));
      else if (state.panditSort === "AMOUNT_DESC") list.sort((a, b) => b.dakshinaCommittedPaise - a.dakshinaCommittedPaise);

      const listHtml = list.length === 0
        ? `<div class="heritage-card p-5 bg-[#fff4e5] border-l-4 border-l-[#ef7624] text-[15px] text-[#6d451e]">🪷 ${escapeHtml(t("emptyPandit"))}</div>`
        : list.map(b => {
            const received = c.paidByBooking[b.id] || 0;
            const remaining = remOf(b);
            const payments = state.dakshinaPayments.filter(p => p.bookingId === b.id);
            const postponements = state.dakshinaPostponements.filter(p => p.bookingId === b.id);
            const poojaObj = POOJA_TYPES.find(p => p.id === b.poojaType);
            const poojaName = b.poojaType === "CUSTOM" && b.customPoojaName ? b.customPoojaName : (poojaObj ? poojaObj[state.lang] : b.poojaType);
            return `
              <div class="heritage-card p-5 space-y-3">
                <div class="flex justify-between items-start gap-2">
                  <div>
                    <div class="serif-title text-lg font-bold">${escapeHtml(b.clientName)}</div>
                    <div class="text-sm text-[#6e736a]">${escapeHtml(poojaName)} • ${escapeHtml(b.date)} (${escapeHtml(b.timeSlot)}) • <span class="text-[#ef7624] font-semibold">${formatDayDelta(b.date)}</span></div>
                    ${b.phone || b.location ? `<div class="text-xs text-[#6e736a] mt-0.5"><span class="phone-num">📞 ${escapeHtml(b.phone || "-")}</span> • 📍 ${escapeHtml(b.location || "-")}</div>` : ""}
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold ${remaining === 0 ? "bg-[#e8f3e7] text-[#176b3a]" : "bg-[#fff0e2] text-[#ef7624]"}">${remaining === 0 ? "Settled" : "Pending"}</span>
                    <button type="button" onclick="pushView('pandit_edit_booking', { id: '${b.id}' })" class="btn-outline !min-h-[32px] !px-2.5 !py-1 text-xs">✏️</button>
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-2.5 border-t border-[#eadfce] text-sm">
                  <div><div class="text-xs text-[#6e736a]">Committed</div><div class="font-bold">${formatInr(b.dakshinaCommittedPaise)}</div></div>
                  <div><div class="text-xs text-[#6e736a]">Received</div><div class="font-bold text-[#176b3a]">${formatInr(received)}</div></div>

    // ==================== 2. AGRICULTURE FULL SCREENS ====================
    function getLinkedWagesForCrop(cc) {
      const target = (cc.farmName || "").trim().toLowerCase();
      return (state.agriWages || []).filter(w =>
        w.cycleId === cc.id || (target && (w.landName || "").trim().toLowerCase() === target)
      );
    }

    function getAllFieldNames() {
      const set = new Set();
      state.cropCycles.forEach(cc => { if (cc.farmName) set.add(cc.farmName.trim()); });
      (state.agriWages || []).forEach(w => { if (w.landName && w.landName !== "General / No Field") set.add(w.landName.trim()); });
      return [...set].sort((a, b) => a.localeCompare(b));
    }

    function renderAgriculture(c) {
      const net = c.agriIncome - c.agriExpense;
      let crops = [...state.cropCycles];
      const cropStats = cc => {
        const expCat = state.agriExpenses.filter(e => e.cycleId === cc.id).reduce((a, b) => a + b.amountPaise, 0);
        const linkedWages = getLinkedWagesForCrop(cc);
        const wagePaid = linkedWages.reduce((a, w) => a + (c.wagePaidById[w.id] || 0), 0);
        const wagePend = linkedWages.reduce((a, w) => a + Math.max(0, w.wagePaise - (c.wagePaidById[w.id] || 0)), 0);
        const sales = state.cropSales.filter(s => s.cycleId === cc.id);
        const saleRecv = sales.reduce((a, b) => a + b.receivedPaise, 0);
        const salePend = sales.reduce((a, b) => a + Math.max(0, b.totalPaise - b.receivedPaise), 0);
        const totalExp = expCat + wagePaid;
        return { expCat, linkedWages, wagePaid, wagePend, saleRecv, salePend, totalExp, profit: saleRecv - totalExp };
      };
      if (state.cropSort === "DATE_DESC") crops.sort((a, b) => (b.sowingDate || "").localeCompare(a.sowingDate || ""));
      else if (state.cropSort === "DATE_ASC") crops.sort((a, b) => (a.sowingDate || "").localeCompare(b.sowingDate || ""));
      else if (state.cropSort === "FARM_ASC") crops.sort((a, b) => a.farmName.localeCompare(b.farmName));
      else if (state.cropSort === "CROP_ASC") crops.sort((a, b) => a.cropName.localeCompare(b.cropName));
      else if (state.cropSort === "PROFIT_DESC") crops.sort((a, b) => cropStats(b).profit - cropStats(a).profit);
      else if (state.cropSort === "EXPENSE_DESC") crops.sort((a, b) => cropStats(b).totalExp - cropStats(a).totalExp);

      const cyclesHtml = crops.length === 0
        ? `<div class="heritage-card p-5 bg-[#e8f3e7] border-l-4 border-l-[#176b3a] text-[15px] text-[#214a2e]">🌿 ${escapeHtml(t("emptyAgri"))}</div>`
        : crops.map(cc => {
            const st = cropStats(cc);
            return `
              <div class="heritage-card clickable-card p-5 space-y-3" onclick="pushView('crop_detail', { id: '${cc.id}' })">
                <div class="flex justify-between items-start gap-2">
                  <div>
                    <div class="serif-title text-lg font-bold text-[#176b3a]">${escapeHtml(cc.cropName)} — ${escapeHtml(cc.farmName)}</div>
                    <div class="text-xs text-[#6e736a]">${escapeHtml(cc.season)} • ${escapeHtml(cc.acres || "-")} Acres • Sown: ${escapeHtml(cc.sowingDate)} (${formatDayDelta(cc.sowingDate)})</div>
                    <div class="text-[11px] font-semibold text-[#ef7624] mt-1">Open full screen breakdown →</div>
                  </div>
                  <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold ${st.profit >= 0 ? "bg-[#e8f3e7] text-[#176b3a]" : "bg-[#fdecec] text-[#7a1f2b]"}">${st.profit >= 0 ? "Profit" : "Loss"}</span>
                    <button type="button" onclick="pushView('agri_edit_crop', { id: '${cc.id}' })" class="btn-outline !min-h-[32px] !px-2.5 !py-1 text-xs">✏️</button>
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-[#eadfce] text-sm">
                  <div><div class="text-xs text-[#6e736a]">Total Exp.</div><div class="font-bold text-[#7a1f2b]">${formatInr(st.totalExp)}</div></div>
                  <div><div class="text-xs text-[#6e736a]">Sales Recv</div><div class="font-bold text-[#176b3a]">${formatInr(st.saleRecv)}</div></div>
                  <div><div class="text-xs text-[#6e736a]">Net Profit</div><div class="font-bold">${formatInr(st.profit)}</div></div>
                </div>
                <div class="text-xs text-[#6e736a] flex justify-between">
                  <span>Linked Workers: <strong>${st.linkedWages.length}</strong> (Pending: ${formatInr(st.wagePend)})</span>
                  ${st.salePend > 0 ? `<span class="text-[#ef7624] font-semibold">Buyer Due: ${formatInr(st.salePend)}</span>` : ""}
                </div>
                <div class="flex gap-2" onclick="event.stopPropagation()">
                  <button type="button" onclick="pushView('agri_add_expense', { cycleId: '${cc.id}' })" class="btn-outline flex-1 text-xs">${escapeHtml(t("addExpense"))}</button>
                  <button type="button" onclick="pushView('agri_add_sale', { cycleId: '${cc.id}' })" class="btn-green flex-1 text-xs">${escapeHtml(t("addSale"))}</button>
                </div>
              </div>`;
          }).join("");

      // Labour Wages filtering & sorting (including Field filter & Field sort!)
      const wagesList = state.agriWages || [];
      const workerNames = [...new Set(wagesList.map(w => w.workerName))];
      const allFields = getAllFieldNames();
      let filteredWages = [...wagesList];
      if (state.agriWageFilter) filteredWages = filteredWages.filter(w => w.workerName === state.agriWageFilter);
      if (state.agriWageFieldFilter) filteredWages = filteredWages.filter(w => (w.landName || "General / No Field") === state.agriWageFieldFilter);

      const wageRem = w => Math.max(0, w.wagePaise - (c.wagePaidById[w.id] || 0));
      if (state.wageSort === "DATE_DESC") filteredWages.sort((a, b) => (b.workDate || "").localeCompare(a.workDate || ""));
      else if (state.wageSort === "DATE_ASC") filteredWages.sort((a, b) => (a.workDate || "").localeCompare(b.workDate || ""));
      else if (state.wageSort === "NAME_ASC") filteredWages.sort((a, b) => a.workerName.localeCompare(b.workerName));
      else if (state.wageSort === "LAND_ASC") filteredWages.sort((a, b) => (a.landName || "").localeCompare(b.landName || ""));
      else if (state.wageSort === "PENDING_FIRST") filteredWages.sort((a, b) => wageRem(b) - wageRem(a));
      else if (state.wageSort === "COMPLETED_FIRST") filteredWages.sort((a, b) => wageRem(a) - wageRem(b));
      else if (state.wageSort === "AMOUNT_DESC") filteredWages.sort((a, b) => b.wagePaise - a.wagePaise);

      const wagesHtml = filteredWages.length === 0
        ? `<div class="heritage-card p-5 bg-[#e8f3e7] border-l-4 border-l-[#176b3a] text-[15px] text-[#214a2e]">🧑‍🌾 ${escapeHtml(t("emptyWages"))}</div>`
        : filteredWages.map(w => {
            const paid = c.wagePaidById[w.id] || 0;
            const rem = wageRem(w);
            return `
              <div class="heritage-card clickable-card p-5 space-y-2.5" onclick="pushView('worker_profile', { name: '${escapeHtml(w.workerName).replace(/'/g, "\\'")}' })">
                <div class="flex justify-between items-start gap-2">
                  <div>
                    <div class="serif-title text-lg font-bold text-[#176b3a]">${escapeHtml(w.workerName)} <span class="text-xs font-normal text-[#ef7624]">(Profile →)</span></div>
                    <div class="text-xs text-[#6e736a] mt-0.5"><span class="phone-num">📞 ${escapeHtml(w.phone || "-")}</span> • 🌾 Field: <strong>${escapeHtml(w.landName || "General / No Field")}</strong></div>
                    <div class="text-xs text-[#6e736a] mt-0.5">📅 Worked: <strong>${escapeHtml(w.workDate)}</strong> (${formatDayDelta(w.workDate)})${w.workNote ? " • " + escapeHtml(w.workNote) : ""}</div>
                  </div>
                  <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold ${rem === 0 ? "bg-[#e8f3e7] text-[#176b3a]" : "bg-[#fff0e2] text-[#ef7624]"}">${rem === 0 ? "Completed" : "Pending"}</span>
                    <button type="button" onclick="pushView('agri_edit_wage', { id: '${w.id}' })" class="btn-outline !min-h-[32px] !px-2.5 !py-1 text-xs">✏️</button>
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-[#eadfce] text-sm">
                  <div><div class="text-xs text-[#6e736a]">To Be Given</div><div class="font-bold">${formatInr(w.wagePaise)}</div></div>
                  <div><div class="text-xs text-[#6e736a]">Paid</div><div class="font-bold text-[#176b3a]">${formatInr(paid)}</div></div>
                  <div><div class="text-xs text-[#6e736a]">Balance</div><div class="font-bold text-[#7a1f2b]">${formatInr(rem)}</div></div>
                </div>
                ${rem > 0 ? `<div onclick="event.stopPropagation()"><button type="button" onclick="pushView('agri_pay_wage', { id: '${w.id}' })" class="btn-green w-full text-sm">${escapeHtml(t("payWage"))}</button></div>` : ""}
              </div>`;
          }).join("");

      return `
        <main class="px-4 sm:px-8 pt-5 pb-8 space-y-5">
          ${renderSubScreenBar(t("agri"))}
          <div class="rounded-[22px] p-6 text-white flex items-center justify-between" style="background:linear-gradient(120deg,#23834a,#10552f)">
            <div>
              <div class="text-xs tracking-[1.4px] text-[#d6f0de] font-bold">${escapeHtml(t("agriBlessing"))}</div>
              <h2 class="serif-title text-2xl sm:text-3xl font-bold mt-1">${escapeHtml(t("agri"))}</h2>
              <p class="text-sm text-white/90 mt-1">${escapeHtml(t("agriDesc"))}</p>
            </div>
            <div class="text-5xl opacity-90">🌾</div>
          </div>

            <div class="heritage-card p-4"><div class="text-xs text-[#6e736a]">Farm Expenses</div><div class="serif-title text-lg font-bold text-[#7a1f2b] mt-1">${formatInr(c.agriExpense)}</div></div>
            <div class="heritage-card p-4"><div class="text-xs text-[#6e736a]">Pending Wages</div><div class="serif-title text-lg font-bold text-[#ef7624] mt-1">${formatInr(c.agriWagesPending)}</div></div>

              <select class="input-field max-w-[230px]" onchange="state.cropSort=this.value; render();">
                <option value="DATE_DESC" ${state.cropSort === "DATE_DESC" ? "selected" : ""}>Sort: Latest Sown</option>
                <option value="DATE_ASC" ${state.cropSort === "DATE_ASC" ? "selected" : ""}>Sort: Oldest Sown</option>
                <option value="FARM_ASC" ${state.cropSort === "FARM_ASC" ? "selected" : ""}>Sort: Field / Farm (A–Z)</option>
                <option value="CROP_ASC" ${state.cropSort === "CROP_ASC" ? "selected" : ""}>Sort: Crop Name (A–Z)</option>
                <option value="PROFIT_DESC" ${state.cropSort === "PROFIT_DESC" ? "selected" : ""}>Sort: Highest Profit</option>

            <div class="flex flex-wrap items-center gap-2.5">
              <button type="button" onclick="pushView('agri_new_wage')" class="btn-primary">${escapeHtml(t("addWage"))}</button>
              <select class="input-field max-w-[210px]" onchange="state.wageSort=this.value; render();">
                <option value="DATE_DESC" ${state.wageSort === "DATE_DESC" ? "selected" : ""}>Sort: Latest Day</option>
                <option value="DATE_ASC" ${state.wageSort === "DATE_ASC" ? "selected" : ""}>Sort: Oldest Day</option>
                <option value="NAME_ASC" ${state.wageSort === "NAME_ASC" ? "selected" : ""}>Sort: Coolie Name (A–Z)</option>
                <option value="LAND_ASC" ${state.wageSort === "LAND_ASC" ? "selected" : ""}>Sort: Field Name (A–Z)</option>
                <option value="PENDING_FIRST" ${state.wageSort === "PENDING_FIRST" ? "selected" : ""}>Sort: Pending First</option>
                <option value="COMPLETED_FIRST" ${state.wageSort === "COMPLETED_FIRST" ? "selected" : ""}>Sort: Completed First</option>

              ${workerNames.length > 1 ? `<select class="input-field max-w-[190px]" onchange="state.agriWageFilter=this.value; render();"><option value="">All Coolies</option>${workerNames.map(n => `<option value="${escapeHtml(n)}" ${state.agriWageFilter === n ? "selected" : ""}>${escapeHtml(n)}</option>`).join("")}</select>` : ""}

    function renderCropDetailScreen(cycleId, c) {
      const cc = state.cropCycles.find(x => x.id === cycleId);
      if (!cc) return `<main class="p-6">${renderSubScreenBar("Not Found")}<div class="heritage-card p-5">Crop not found.</div></main>`;
      const exps = state.agriExpenses.filter(e => e.cycleId === cc.id);
      const sales = state.cropSales.filter(s => s.cycleId === cc.id);
      const linkedWages = getLinkedWagesForCrop(cc);

      const expCatTotal = exps.reduce((a, b) => a + b.amountPaise, 0);
      const wagePaidTotal = linkedWages.reduce((a, w) => a + (c.wagePaidById[w.id] || 0), 0);
      const wagePendTotal = linkedWages.reduce((a, w) => a + Math.max(0, w.wagePaise - (c.wagePaidById[w.id] || 0)), 0);
      const saleRecv = sales.reduce((a, b) => a + b.receivedPaise, 0);
      const totalExp = expCatTotal + wagePaidTotal;
      const netProfit = saleRecv - totalExp;

      const cmpDate = (a, b) => state.fieldDateOrder === "ASC" ? (a || "").localeCompare(b || "") : (b || "").localeCompare(a || "");
      function groupByDate(list, dateKey) {
        const map = {};
        list.forEach(item => {
          const d = item[dateKey] || "Unknown Date";
          if (!map[d]) map[d] = [];
          map[d].push(item);
        });
        return Object.keys(map).sort(cmpDate).map(d => [d, map[d]]);
      }

      const expByDate = groupByDate(exps, "date");
      const expSection = expByDate.length === 0
        ? `<div class="heritage-card p-4 text-sm text-[#6e736a]">No input expenses logged yet.</div>`
        : expByDate.map(([d, items]) => `
            <div class="heritage-card p-4 space-y-2">
              <div class="flex justify-between items-center font-bold text-sm text-[#26332b]">
                <span>📅 ${escapeHtml(d)} <span class="text-xs font-normal text-[#ef7624]">(${formatDayDelta(d)})</span></span>
                <span class="text-[#7a1f2b]">${formatInr(items.reduce((a, b) => a + b.amountPaise, 0))}</span>
              </div>
              ${items.map(it => {
                const reason = it.category === "OTHER" && it.customCategory ? `Other: ${it.customCategory}` : (AGRI_CATEGORIES.find(k => k.id === it.category)?.[state.lang] || it.category);
                return `<div class="text-xs text-[#6e736a] flex justify-between items-center border-t border-[#f3ece1] pt-1.5"><span><strong>${escapeHtml(reason)}</strong>${it.notes ? " • " + escapeHtml(it.notes) : ""}</span><span><strong>${formatInr(it.amountPaise)}</strong> <button type="button" onclick="pushView('agri_edit_expense', { id: '${it.id}' })" class="ml-2 text-[#ef7624] underline bg-transparent border-0 cursor-pointer">Edit</button></span></div>`;
              }).join("")}
            </div>`).join("");

      const wagesByDate = groupByDate(linkedWages, "workDate");
      const wageSection = wagesByDate.length === 0
        ? `<div class="heritage-card p-4 text-sm text-[#6e736a]">No worker wages linked to "${escapeHtml(cc.farmName)}" yet.</div>`
        : wagesByDate.map(([d, items]) => `
            <div class="heritage-card p-4 space-y-2">
              <div class="flex justify-between items-center font-bold text-sm text-[#26332b]">
                <span>📅 ${escapeHtml(d)} <span class="text-xs font-normal text-[#ef7624]">(${formatDayDelta(d)})</span></span>
                <span class="text-[#176b3a]">${items.length} ${tr("worker(s)", "కూలీలు")} • ${formatInr(items.reduce((a, w) => a + w.wagePaise, 0))}</span>
              </div>
              ${items.map(w => {
                const paid = c.wagePaidById[w.id] || 0;
                const rem = Math.max(0, w.wagePaise - paid);
                return `
                  <div class="flex justify-between items-center border-t border-[#f3ece1] pt-2 cursor-pointer" onclick="pushView('worker_profile', { name: '${escapeHtml(w.workerName).replace(/'/g, "\\'")}' })">
                    <div>
                      <div class="font-bold text-sm text-[#176b3a] underline">${escapeHtml(w.workerName)} →</div>
                      <div class="text-[11px] text-[#6e736a]"><span class="phone-num">📞 ${escapeHtml(w.phone || "-")}</span>${w.workNote ? " • " + escapeHtml(w.workNote) : ""}</div>
                    </div>
                    <div class="text-right text-xs">
                      <div class="font-bold">${formatInr(w.wagePaise)}</div>
                      <div class="${rem > 0 ? "text-[#ef7624] font-semibold" : "text-[#176b3a]"}">${rem > 0 ? "Pending " + formatInr(rem) : "Paid"}</div>
                    </div>
                  </div>`;
              }).join("")}
            </div>`).join("");

      const salesByDate = groupByDate(sales, "date");
      const salesSection = salesByDate.length === 0
        ? `<div class="heritage-card p-4 text-sm text-[#6e736a]">No harvest sales recorded yet.</div>`
        : salesByDate.map(([d, items]) => `
            <div class="heritage-card p-4 space-y-2">
              <div class="flex justify-between items-center font-bold text-sm text-[#26332b]">
                <span>📅 ${escapeHtml(d)} <span class="text-xs font-normal text-[#ef7624]">(${formatDayDelta(d)})</span></span>
                <span class="text-[#176b3a]">${formatInr(items.reduce((a, b) => a + b.receivedPaise, 0))}</span>
              </div>
              ${items.map(s => `
                <div class="flex justify-between text-xs border-t border-[#f3ece1] pt-1.5">
                  <div><strong>${escapeHtml(s.buyer)}</strong> • Qty: ${escapeHtml(s.qty || "-")} kg • <span class="phone-num">📞 ${escapeHtml(s.phone || "-")}</span></div>
                  <div class="text-right"><strong class="text-[#176b3a]">Recv: ${formatInr(s.receivedPaise)}</strong> / ${formatInr(s.totalPaise)}</div>
                </div>`).join("")}
            </div>`).join("");

      return `
        <main class="px-4 sm:px-8 pt-5 pb-8 space-y-5">
          ${renderSubScreenBar("Crop & Field Details")}
          <div class="rounded-[22px] p-6 text-white flex justify-between items-center" style="background:linear-gradient(120deg,#23834a,#10552f)">
            <div>
              <div class="text-xs text-[#d6f0de] font-bold">${escapeHtml(cc.season)} • ${escapeHtml(cc.acres || "-")} Acres</div>
              <h2 class="serif-title text-2xl sm:text-3xl font-bold mt-1">${escapeHtml(cc.cropName)} — ${escapeHtml(cc.farmName)}</h2>
              <div class="text-xs text-white/90 mt-1">Sown: ${escapeHtml(cc.sowingDate)} (${formatDayDelta(cc.sowingDate)})</div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button type="button" onclick="pushView('agri_edit_crop', { id: '${cc.id}' })" class="btn-gold-cream text-xs">✏️ Edit</button>
              <button type="button" onclick="confirmDeleteItem('crop', '${cc.id}')" title="${tr("Delete Field", "పొలం తొలగించు")}" aria-label="Delete" class="w-9 h-9 rounded-xl bg-[#fef2f2] text-[#dc2626] border border-[#fca5a5] flex items-center justify-center text-sm cursor-pointer">🗑️</button>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3 text-center">
            <div class="heritage-card p-4"><div class="text-xs text-[#6e736a]">Total Expenses</div><div class="serif-title text-lg font-bold text-[#7a1f2b] mt-1">${formatInr(totalExp)}</div></div>
            <div class="heritage-card p-4"><div class="text-xs text-[#6e736a]">Sales Received</div><div class="serif-title text-lg font-bold text-[#176b3a] mt-1">${formatInr(saleRecv)}</div></div>
            <div class="heritage-card p-4"><div class="text-xs text-[#6e736a]">Net Profit</div><div class="serif-title text-lg font-bold ${netProfit >= 0 ? "text-[#176b3a]" : "text-[#7a1f2b]"} mt-1">${formatInr(netProfit)}</div></div>
          </div>
          <div class="flex flex-wrap gap-2.5">
            <button type="button" onclick="pushView('agri_add_expense', { cycleId: '${cc.id}' })" class="btn-outline">+ Log Expense</button>
            <button type="button" onclick="pushView('agri_new_wage', { prefillLand: '${escapeHtml(cc.farmName).replace(/'/g, "\\'")}', prefillCycleId: '${cc.id}' })" class="btn-primary">+ Add Field Worker Wage</button>
            <button type="button" onclick="pushView('agri_add_sale', { cycleId: '${cc.id}' })" class="btn-green">+ Log Sale</button>
            <select class="input-field max-w-[210px]" onchange="state.fieldDateOrder=this.value; render();">
              <option value="DESC" ${state.fieldDateOrder === "DESC" ? "selected" : ""}>Dates: Newest First</option>
              <option value="ASC" ${state.fieldDateOrder === "ASC" ? "selected" : ""}>Dates: Oldest First</option>
            </select>
          </div>
          <section class="space-y-2.5"><h3 class="serif-title text-lg font-bold">1. Expenditures by Date (${formatInr(expCatTotal)})</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${expSection}</div></section>
          <section class="space-y-2.5"><h3 class="serif-title text-lg font-bold">2. Workers & Wages by Date — ${escapeHtml(cc.farmName)} (Paid: ${formatInr(wagePaidTotal)} | Pending: ${formatInr(wagePendTotal)})</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${wageSection}</div></section>
          <section class="space-y-2.5"><h3 class="serif-title text-lg font-bold">3. Harvest & Crop Sales by Date</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${salesSection}</div></section>
        </main>`;
    }

    function renderWorkerProfileScreen(workerName, c) {
      const entries = (state.agriWages || []).filter(w => w.workerName === workerName).sort((a, b) => (b.workDate || "").localeCompare(a.workDate || ""));
      if (entries.length === 0) return `<main class="p-6">${renderSubScreenBar("Worker Profile")}<div class="heritage-card p-5">No records found.</div></main>`;
      const phone = entries.find(e => e.phone)?.phone || "-";
      const totalCommitted = entries.reduce((a, b) => a + b.wagePaise, 0);
      const totalPaid = entries.reduce((a, b) => a + (c.wagePaidById[b.id] || 0), 0);
      const totalPending = Math.max(0, totalCommitted - totalPaid);

      return `
        <main class="px-4 sm:px-8 pt-5 pb-8 space-y-5 max-w-3xl mx-auto">
          ${renderSubScreenBar("Worker Profile")}
          <div class="heritage-card p-5 flex justify-between items-start gap-3">
            <div><h2 class="serif-title text-2xl font-bold">${escapeHtml(workerName)}</h2><div class="text-sm text-[#6e736a] mt-1"><span class="phone-num">📞 ${escapeHtml(phone)}</span> • Days Worked: <strong>${entries.length}</strong></div></div>
            <div class="flex items-start gap-2.5 shrink-0">
              <div class="text-right"><div class="text-xs text-[#6e736a]">Total Pending</div><div class="serif-title text-2xl font-bold text-[#ef7624]">${formatInr(totalPending)}</div></div>
              <button type="button" onclick="confirmDeleteItem('worker', '${escapeHtml(workerName).replace(/'/g, "\\'")}')" title="${tr("Delete Worker", "కూలీని తొలగించు")}" aria-label="Delete" class="w-9 h-9 rounded-xl bg-[#fef2f2] text-[#dc2626] border border-[#fca5a5] flex items-center justify-center text-sm cursor-pointer">🗑️</button>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3 text-center">
            <div class="heritage-card p-4"><div class="text-xs text-[#6e736a]">Total Earned</div><div class="font-bold text-lg mt-0.5">${formatInr(totalCommitted)}</div></div>
            <div class="heritage-card p-4"><div class="text-xs text-[#6e736a]">Total Paid</div><div class="font-bold text-lg text-[#176b3a] mt-0.5">${formatInr(totalPaid)}</div></div>
            <div class="heritage-card p-4"><div class="text-xs text-[#6e736a]">Balance</div><div class="font-bold text-lg text-[#7a1f2b] mt-0.5">${formatInr(totalPending)}</div></div>
          </div>
          <div>
            <button type="button" onclick="pushView('agri_new_wage', { prefillWorker: '${escapeHtml(workerName).replace(/'/g, "\'")}', prefillPhone: '${escapeHtml(phone === '-' ? '' : phone).replace(/'/g, "\'")}', prefillLand: '${escapeHtml(entries[0].landName === 'General / No Field' ? '' : (entries[0].landName || '')).replace(/'/g, "\'")}' })" class="btn-primary w-full">
              + ${tr("Add More Work Days for", "మరిన్ని పని రోజులు జోడించు —")} ${escapeHtml(workerName)}
            </button>
          </div>
          <div class="space-y-3">
            <h3 class="serif-title text-lg font-bold">${tr("Work History Across All Fields", "అన్ని పొలాలలో పని చేసిన రోజులు")}</h3>
            ${entries.map(w => {
              const paid = c.wagePaidById[w.id] || 0;
              const rem = Math.max(0, w.wagePaise - paid);
              return `
                <div class="heritage-card p-4 flex justify-between items-center gap-3">
                  <div>
                    <div class="font-bold text-base">🌾 ${escapeHtml(w.landName || "General / No Field")} • ${escapeHtml(w.workDate)}</div>
                    <div class="text-xs text-[#6e736a]">${formatDayDelta(w.workDate)}${w.workNote ? " • " + escapeHtml(w.workNote) : ""}</div>
                  </div>
                  <div class="text-right">
                    <div class="font-bold">${formatInr(w.wagePaise)}</div>
                    ${rem > 0 ? `<button type="button" onclick="pushView('agri_pay_wage', { id: '${w.id}' })" class="btn-green !min-h-[34px] !py-1 !px-3 text-xs mt-1">Pay ${formatInr(rem)}</button>` : `<span class="text-xs text-[#176b3a] font-bold">Paid</span>`}
                  </div>
                </div>`;
            }).join("")}
          </div>
        </main>`;
    }

    function renderAgriAddExpense(cycleId) {
      return `
        <main class="px-4 sm:px-8 pt-5 pb-8 max-w-2xl mx-auto">
          ${renderSubScreenBar("Log Farm Expense")}
          <div class="heritage-card p-6">

    function getWageMode() {
      const sel = document.querySelector('#wage-form input[name="wageMode"]:checked');
      return sel ? sel.value : "SAME";
    }

    function toggleWageModeUI() {
      const mode = getWageMode();
      const sameWrap = document.getElementById("same-wage-wrap");
      const sameInp = document.querySelector('#wage-form input[name="wageAmount"]');
      if (sameWrap) sameWrap.style.display = mode === "SAME" ? "block" : "none";
      if (sameInp) sameInp.required = mode === "SAME";
      document.querySelectorAll('#wage-dates-list input[name="rowWages"]').forEach(inp => {
        inp.style.display = mode === "MANUAL" ? "block" : "none";
        inp.required = mode === "MANUAL";
      });
      updateMultiDayWageTotal();
    }

    function addWageDateRow() {
      const box = document.getElementById("wage-dates-list");
      if (!box) return;
      const mode = getWageMode();
      const row = document.createElement("div");
      row.className = "flex gap-2 items-center";
      row.innerHTML = `<input type="date" name="workDates" value="${todayIso()}" required class="input-field flex-1" oninput="updateMultiDayWageTotal()" /><input type="number" step="0.01" min="0.01" name="rowWages" placeholder="₹ Wage" ${mode === "MANUAL" ? "required" : ""} style="display:${mode === "MANUAL" ? "block" : "none"}" class="input-field w-28" oninput="updateMultiDayWageTotal()" /><button type="button" onclick="this.parentElement.remove(); updateMultiDayWageTotal();" class="btn-outline !min-h-[42px] !px-3 text-xs text-[#7a1f2b]">✕</button>`;
      box.appendChild(row);
      updateMultiDayWageTotal();
    }

    function updateMultiDayWageTotal() {
      const mode = getWageMode();
      const dateInputs = document.querySelectorAll('#wage-dates-list input[name="workDates"]');
      const count = dateInputs.length || 1;
      const out = document.getElementById("wage-multi-total");
      if (!out) return;
      if (mode === "SAME") {
        const dailyInput = document.querySelector('#wage-form input[name="wageAmount"]');
        const dailyPaise = rupeesToPaise(dailyInput ? dailyInput.value : 0);
        const safe = (!isNaN(dailyPaise) && dailyPaise > 0) ? dailyPaise : 0;
        out.textContent = `${count} ${tr("day(s)", "రోజులు")} × ${formatInr(safe)} = ${formatInr(safe * count)}`;
      } else {
        let sum = 0;
        document.querySelectorAll('#wage-dates-list input[name="rowWages"]').forEach(inp => {
          const p = rupeesToPaise(inp.value);
          if (!isNaN(p) && p > 0) sum += p;
        });
        out.textContent = `${count} ${tr("day(s) (Manual per day)", "రోజులు (ప్రతి రోజు వేరు)")} = ${formatInr(sum)}`;
      }
    }

    function renderPersonal(c) {
      const spendByCat = {};

      const budgetKeys = Object.keys(state.budgets);
      const budgetHtml = budgetKeys.length === 0 ? "" : `
        <div class="heritage-card p-5 space-y-3">
          <div class="serif-title font-bold text-lg">Monthly Category Budgets</div>
          ${budgetKeys.map(catId => {
            const limit = state.budgets[catId];
            const spent = spendByCat[catId] || 0;
            const pct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;
            const cat = PERSONAL_CATEGORIES.find(x => x.id === catId);
            return `<div><div class="flex justify-between text-sm"><span>${cat ? cat[state.lang] : catId}</span><span class="font-bold">${formatInr(spent)} / ${formatInr(limit)}</span></div><div class="w-full h-2.5 bg-[#eadfce] rounded-full mt-1 overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${spent > limit ? "#7a1f2b" : "#176b3a"}"></div></div></div>`;
          }).join("")}
        </div>`;

      let txns = [...state.personalTxns];
      if (state.personalSort === "DATE_DESC") txns.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      else if (state.personalSort === "DATE_ASC") txns.sort((a, b) => (a.date || "").localeCompare(b.date || ""));

    function collectAllCalendarEvents(c) {
      const events = [];
      state.bookings.forEach(b => {
        events.push({ date: b.date, color: "#ef7624", badge: "Pooja", title: `${b.clientName} (${b.timeSlot})`, detail: `Committed: ${formatInr(b.dakshinaCommittedPaise)}` });
        const rem = Math.max(0, b.dakshinaCommittedPaise - (c.paidByBooking[b.id] || 0));
        if (rem > 0 && b.currentPromisedDate) events.push({ date: b.currentPromisedDate, color: "#d95d13", badge: "Dakshina Due", title: b.clientName, detail: `Pending: ${formatInr(rem)}` });
      });
      (state.agriWages || []).forEach(w => {
        const rem = Math.max(0, w.wagePaise - (c.wagePaidById[w.id] || 0));
        events.push({ date: w.workDate, color: "#176b3a", badge: rem > 0 ? "Wage Due" : "Farm Work", title: `${w.workerName} (${w.landName || "General"})`, detail: rem > 0 ? `Pending: ${formatInr(rem)}` : `Paid ${formatInr(w.wagePaise)}` });
      });
      state.cropSales.forEach(s => {
        const rem = Math.max(0, s.totalPaise - s.receivedPaise);
        if (rem > 0 && s.dueDate) events.push({ date: s.dueDate, color: "#176b3a", badge: "Buyer Due", title: s.buyer, detail: `Pending: ${formatInr(rem)}` });
      });
      state.loans.forEach(l => {
        const calc = calcLoanSummary(l, state.loanRepayments);
        if (calc.totalOutPaise > 0) {
          calc.recurringDates.forEach((d, idx) => {
            events.push({ date: d, color: "#7a1f2b", badge: l.ratePeriod === "ANNUAL" ? "Annual Loan Due" : "Monthly Loan Due", title: `${l.personName} (${l.direction})`, detail: `${l.ratePeriod === "ANNUAL" ? "Yr" : "Mo"} ${idx + 1} Int: ${formatInr(calc.periodInterestPaise)}` });
          });
        }
      });
      return events;
    }

    function changeCalMonth(delta) {
      let m = state.calMonth + delta, y = state.calYear;
      if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
      state.calMonth = m; state.calYear = y; render();
    }

    function renderReminders(c) {
      const allEvents = collectAllCalendarEvents(c);
      const eventsByDate = {};
      allEvents.forEach(ev => { if (!eventsByDate[ev.date]) eventsByDate[ev.date] = []; eventsByDate[ev.date].push(ev); });

      const year = state.calYear, month = state.calMonth;
      const monthLabel = new Date(year, month, 1).toLocaleString("en-IN", { month: "long", year: "numeric" });
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = todayIso();

      let cellsHtml = "";
      for (let i = 0; i < firstDow; i++) cellsHtml += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const dayEvs = eventsByDate[iso] || [];
        const isToday = iso === today, isSel = iso === state.calSelectedDate;
        const dots = [...new Set(dayEvs.map(e => e.color))].slice(0, 3).map(col => `<span class="w-1.5 h-1.5 rounded-full inline-block" style="background:${isSel ? "#fff" : col}"></span>`).join("");
        cellsHtml += `<button type="button" onclick="state.calSelectedDate='${iso}'; render();" class="cal-cell ${isToday ? "today" : ""} ${isSel ? "selected" : ""}"><span class="text-sm">${day}</span><div class="flex gap-0.5 mt-1 h-2">${dots}</div></button>`;
      }

      const selectedEvents = eventsByDate[state.calSelectedDate] || [];
      const upcoming = allEvents.filter(e => e.date >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 12);

      return `
        <main class="px-4 sm:px-8 pt-6 pb-8 space-y-5">
          <div><div class="text-xs uppercase tracking-[1.6px] font-extrabold text-[#176b3a]">DHAROHAR SCHEDULE</div><h2 class="serif-title text-2xl font-bold mt-0.5">📅 ${escapeHtml(t("navReminders"))} & Reminders</h2></div>
          <div class="heritage-card p-4 sm:p-5 space-y-3">
            <div class="flex items-center justify-between">
              <button type="button" onclick="changeCalMonth(-1)" class="btn-outline !min-h-[38px] !px-3">←</button>
              <div class="serif-title text-lg font-bold">${escapeHtml(monthLabel)}</div>
              <button type="button" onclick="changeCalMonth(1)" class="btn-outline !min-h-[38px] !px-3">→</button>

    // ==================== ANALYTICS & DUAL-MODE GRAPHING ENGINE ====================
    let analyticsUi = {
      timeframe: "MONTH", // WEEK | MONTH | LAST_3M | YEARLY | ALL
      chartMode: "BAR",   // BAR | GRAPH
      year: new Date().getFullYear(),
      selIncIdx: null,
      selExpIdx: null,
      expandInc: false,
      expandExp: false

    function setAnalyticsOpt(key, val) {
      analyticsUi[key] = val;
      if (key === "timeframe" || key === "year") {
        analyticsUi.selIncIdx = null;
        analyticsUi.selExpIdx = null;
      }
      render();
