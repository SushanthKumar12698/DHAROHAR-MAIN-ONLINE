    function collectAnalyticsTxns() {
      const out = [];
      const bookingMap = {};
      (state.bookings || []).forEach(b => { bookingMap[b.id] = b; });
      const cropMap = {};
      (state.cropCycles || []).forEach(cc => { cropMap[cc.id] = cc; });
      const loanMap = {};
      (state.loans || []).forEach(l => { loanMap[l.id] = l; });

      // 1. Personal Household (Income & Expense, dynamic Other customCategory)
      (state.personalTxns || []).forEach(x => {
        if (x.txnType !== "INCOME" && x.txnType !== "EXPENSE") return;
        const isCustom = x.category === "Other" && Boolean((x.customCategory || "").trim());
        const resolved = isCustom ? x.customCategory.trim() : (x.category || "Other");
        out.push({ date: x.date || todayIso(), type: x.txnType, category: resolved, isCustom, amountPaise: Number(x.amountPaise || 0), source: "Personal" });
      });

      // 2. POUROHITHYAM Dakshina Payments (Income)
      (state.dakshinaPayments || []).forEach(p => {
        const b = bookingMap[p.bookingId];
        const isCustom = b && b.poojaType === "Other" && Boolean((b.customPoojaName || "").trim());
        const poojaLabel = b ? (isCustom ? b.customPoojaName.trim() : (b.poojaType || "Pooja")) : "Pourohithyam";
        out.push({ date: p.paidDate || p.date || todayIso(), type: "INCOME", category: `Pooja: ${poojaLabel}`, isCustom, amountPaise: Number(p.amountPaise || 0), source: "Pourohithyam" });
      });

      // 3. Agriculture Crop Sales (Income)
      (state.cropSales || []).forEach(cs => {
        if (!cs.receivedPaise) return;
        const cc = cropMap[cs.cycleId];
        const label = cc ? `Crop Sale: ${cc.cropName}` : "Agriculture Sale";
        out.push({ date: cs.date || todayIso(), type: "INCOME", category: label, isCustom: false, amountPaise: Number(cs.receivedPaise || 0), source: "Agriculture" });
      });

      // 4. Agriculture Input Expenses (Expense, dynamic Other customCategory)
      (state.agriExpenses || []).forEach(ex => {
        const isCustom = ex.category === "Other" && Boolean((ex.customCategory || "").trim());
        const resolved = isCustom ? ex.customCategory.trim() : `Farm: ${ex.category || "Expense"}`;
        out.push({ date: ex.date || todayIso(), type: "EXPENSE", category: resolved, isCustom, amountPaise: Number(ex.amountPaise || 0), source: "Agriculture" });
      });

      // 5. Paid Farm Labour Wages (Expense)
      (state.agriWagePayments || []).forEach(wp => {
        out.push({ date: wp.paidDate || wp.date || todayIso(), type: "EXPENSE", category: "Farm Labour Wages", isCustom: false, amountPaise: Number(wp.amountPaise || 0), source: "Agriculture" });
      });

      // 6. Loan Interest Profit (Lent) & Cost (Borrowed)
      (state.loanRepayments || []).forEach(r => {
        if (r.paymentType !== "INTEREST") return;
        const l = loanMap[r.loanId];
        if (!l) return;
        if (l.direction === "LENT") {
          out.push({ date: r.paidDate || todayIso(), type: "INCOME", category: "Loan Interest Profit", isCustom: false, amountPaise: Number(r.amountPaise || 0), source: "Loans" });
        } else {
          out.push({ date: r.paidDate || todayIso(), type: "EXPENSE", category: "Loan Interest Cost", isCustom: false, amountPaise: Number(r.amountPaise || 0), source: "Loans" });
        }
      });

      return out;
    }

    function isoShiftDays(baseIso, deltaDays) {
      const d = new Date(baseIso + "T00:00:00");
      d.setDate(d.getDate() + deltaDays);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function monthBounds(year, monthIdx) {
      const start = `${year}-${String(monthIdx + 1).padStart(2, "0")}-01`;
      const lastDay = new Date(year, monthIdx + 1, 0).getDate();
      const end = `${year}-${String(monthIdx + 1).padStart(2, "0")}-${String(lastDay).padStart(2, "0")}`;
      return { start, end, ym: `${year}-${String(monthIdx + 1).padStart(2, "0")}` };
    }

    function formatShortInr(paise) {
      const abs = Math.abs(paise / 100);
      const sign = paise < 0 ? "-" : "";
      if (abs >= 100000) return `${sign}₹${(abs / 100000).toFixed(1)}L`;
      if (abs >= 1000) return `${sign}₹${(abs / 1000).toFixed(1)}k`;
      return `${sign}₹${Math.round(abs)}`;
    }

    function renderDonutSvg(items, totalPaise, palette, selectedIdx, onSelectKey, emptyLabel) {
      if (!items.length || totalPaise <= 0) {
        return `<div class="py-8 text-center text-xs text-[#6e736a]">${escapeHtml(emptyLabel)}</div>`;
      }
      const r = 64, cx = 86, cy = 86, circ = 2 * Math.PI * r;
      let offset = 0;
      const topItem = items[0];
      const active = (selectedIdx !== null && items[selectedIdx]) ? items[selectedIdx] : topItem;
      const activePct = totalPaise > 0 ? ((active.amountPaise / totalPaise) * 100).toFixed(1) : "0.0";

      const arcs = items.map((it, idx) => {
        const frac = it.amountPaise / totalPaise;
        const dash = Math.max(2, frac * circ);
        const col = it.isCustom ? "#d97706" : palette[idx % palette.length];
        const isSel = selectedIdx === idx;
        const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${isSel ? 24 : 18}" stroke-dasharray="${dash.toFixed(2)} ${(circ - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" style="cursor:pointer;transition:stroke-width .2s" onclick="setAnalyticsOpt('${onSelectKey}', ${isSel ? 'null' : idx})"></circle>`;
        offset += dash;
        return seg;
      }).join("");

      const legend = items.slice(0, 8).map((it, idx) => {
        const col = it.isCustom ? "#d97706" : palette[idx % palette.length];
        const pct = totalPaise > 0 ? ((it.amountPaise / totalPaise) * 100).toFixed(1) : "0.0";
        const isSel = selectedIdx === idx;
        return `<button type="button" onclick="setAnalyticsOpt('${onSelectKey}', ${isSel ? 'null' : idx})" class="w-full flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg text-left cursor-pointer border ${isSel ? "bg-[#fff4e5] border-[#ef7624]" : "bg-transparent border-transparent"}">
          <span class="flex items-center gap-2 min-w-0 text-xs text-[#26332b] truncate">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${col}"></span>
            <span class="truncate">${escapeHtml(it.category)}</span>
            ${it.isCustom ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-[#d97706]/20 text-[#b45309] font-bold">Custom</span>` : ""}
          </span>
          <span class="text-xs font-bold text-[#26332b] shrink-0">${formatInr(it.amountPaise)} <span class="text-[#6e736a] font-normal">(${pct}%)</span></span>
        </button>`;
      }).join("");

      return `
        <div class="flex flex-col sm:flex-row items-center gap-4">
          <div class="relative shrink-0">
            <svg width="172" height="172" viewBox="0 0 172 172">
              <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f3ece1" stroke-width="18"></circle>
              ${arcs}
              <text x="${cx}" y="${cy - 10}" text-anchor="middle" fill="#6e736a" font-size="9" font-weight="700">${escapeHtml(active.category.length > 14 ? active.category.slice(0, 13) + "…" : active.category)}</text>
              <text x="${cx}" y="${cy + 7}" text-anchor="middle" fill="#26332b" font-size="13" font-weight="800">${formatShortInr(active.amountPaise)}</text>
              <text x="${cx}" y="${cy + 22}" text-anchor="middle" fill="#176b3a" font-size="10" font-weight="700">${activePct}%</text>
            </svg>
          </div>
          <div class="w-full flex-1 space-y-1">${legend}</div>
        </div>`;
    }

    function renderRankedBars(items, totalPaise, barColor, expandKey, isExpanded, emptyLabel) {
      if (!items.length || totalPaise <= 0) {
        return `<div class="py-6 text-center text-xs text-[#6e736a]">${escapeHtml(emptyLabel)}</div>`;
      }
      const maxVal = Math.max(...items.map(x => x.amountPaise), 1);
      const visible = isExpanded ? items : items.slice(0, 6);
      const rows = visible.map((it, idx) => {
        const wPct = Math.max(4, Math.round((it.amountPaise / maxVal) * 100));
        const share = ((it.amountPaise / totalPaise) * 100).toFixed(1);
        const col = it.isCustom ? "#d97706" : barColor;
        return `
          <div class="space-y-1">
            <div class="flex items-center justify-between gap-2 text-xs">
              <span class="text-[#26332b] font-semibold truncate">${idx + 1}. ${escapeHtml(it.category)} ${it.isCustom ? `<span class="ml-1 text-[9px] px-1.5 py-0.5 rounded bg-[#d97706]/20 text-[#b45309]">Custom</span>` : ""}</span>
              <span class="text-[#26332b] font-bold shrink-0">${formatInr(it.amountPaise)} <span class="text-[#6e736a] font-normal">(${share}%)</span></span>
            </div>
            <div class="w-full h-2.5 rounded-full bg-[#f3ece1] overflow-hidden">
              <div class="h-full rounded-full" style="width:${wPct}%;background:${col}"></div>
            </div>
          </div>`;
      }).join("");
      const toggleBtn = items.length > 6
        ? `<button type="button" onclick="setAnalyticsOpt('${expandKey}', ${!isExpanded})" class="mt-2 text-xs font-bold text-[#176b3a] bg-transparent border-0 cursor-pointer">${isExpanded ? tr("Show Top 6 ▲", "టాప్ 6 చూపు ▲") : tr(`Expand All (${items.length}) ▼`, `అన్నీ చూపు (${items.length}) ▼`)}</button>`
        : "";
      return `<div class="space-y-3">${rows}${toggleBtn}</div>`;
    }

    function renderComparisonSvg(series, mode, showProfitLine = false) {
      if (!series.length) return `<div class="py-6 text-center text-xs text-[#6e736a]">No period data yet.</div>`;
      const W = Math.max(320, series.length * 56), H = 190, padL = 14, padR = 14, padT = 24, padB = 34;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const vals = series.flatMap(s => showProfitLine ? [s.income, s.expense, Math.abs(s.profit)] : [s.income, s.expense]);
      const maxV = Math.max(...vals, 100);

      if (mode === "BAR") {
        const slot = plotW / series.length;
        const bw = Math.min(18, Math.max(8, slot * 0.28));
        const bars = series.map((s, i) => {
          const cx = padL + i * slot + slot / 2;
          const ih = Math.round((s.income / maxV) * plotH);
          const eh = Math.round((s.expense / maxV) * plotH);
          const iy = padT + plotH - ih;
          const ey = padT + plotH - eh;
          const pBadge = showProfitLine && (s.income > 0 || s.expense > 0)
            ? `<text x="${cx}" y="${Math.min(iy, ey) - 6}" text-anchor="middle" fill="${s.profit >= 0 ? '#15803d' : '#b91c1c'}" font-size="8.5" font-weight="700">${formatShortInr(s.profit)}</text>`
            : "";
          return `
            ${pBadge}
            <rect x="${cx - bw - 1.5}" y="${iy}" width="${bw}" height="${Math.max(2, ih)}" rx="3" fill="#176b3a"></rect>
            <rect x="${cx + 1.5}" y="${ey}" width="${bw}" height="${Math.max(2, eh)}" rx="3" fill="#dc2626"></rect>
            <text x="${cx}" y="${H - 12}" text-anchor="middle" fill="#6e736a" font-size="10" font-weight="600">${escapeHtml(s.label)}</text>`;
        }).join("");
        return `
          <div class="overflow-x-auto no-scrollbar">
            <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="min-w-full">
              <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#eadfce" stroke-width="1"></line>
              ${bars}
            </svg>
          </div>`;
      } else {
        const step = series.length > 1 ? plotW / (series.length - 1) : 0;
        const pt = (idx, val) => {
          const x = series.length === 1 ? padL + plotW / 2 : padL + idx * step;
          const y = padT + plotH - (Math.max(0, val) / maxV) * plotH;
          return [x, y];
        };
        const incPts = series.map((s, i) => pt(i, s.income));
        const expPts = series.map((s, i) => pt(i, s.expense));
        const profPts = showProfitLine ? series.map((s, i) => pt(i, Math.max(0, s.profit))) : [];
        const toPoly = pts => pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
        const incArea = `${padL},${padT + plotH} ${toPoly(incPts)} ${incPts[incPts.length - 1][0].toFixed(1)},${padT + plotH}`;
        const labels = series.map((s, i) => {
          const x = series.length === 1 ? padL + plotW / 2 : padL + i * step;
          return `<text x="${x.toFixed(1)}" y="${H - 12}" text-anchor="middle" fill="#6e736a" font-size="10" font-weight="600">${escapeHtml(s.label)}</text>`;
        }).join("");
        const dots = (pts, col) => pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${col}" stroke="#ffffff" stroke-width="1.5"></circle>`).join("");
        return `
          <div class="overflow-x-auto no-scrollbar">
            <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="min-w-full">
              <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#eadfce" stroke-width="1"></line>
              <polygon points="${incArea}" fill="#176b3a" opacity="0.12"></polygon>
              <polyline fill="none" stroke="#176b3a" stroke-width="2.5" stroke-linejoin="round" points="${toPoly(incPts)}"></polyline>
              <polyline fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" points="${toPoly(expPts)}"></polyline>
              ${showProfitLine ? `<polyline fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="4 3" stroke-linejoin="round" points="${toPoly(profPts)}"></polyline>` : ""}
              ${dots(incPts, "#176b3a")}
              ${dots(expPts, "#dc2626")}
              ${showProfitLine ? dots(profPts, "#15803d") : ""}
              ${labels}
            </svg>
          </div>`;
      }
    }

    function renderReports(c) {
      const allTxns = collectAnalyticsTxns();
      const today = todayIso();
      const nowDate = new Date(today + "T00:00:00");
      const curYear = nowDate.getFullYear();
      const curMonth = nowDate.getMonth();

      // Determine available years
      const yearSet = new Set([curYear, analyticsUi.year]);
      allTxns.forEach(tx => { const y = parseInt((tx.date || "").slice(0, 4), 10); if (y >= 2000 && y <= 2100) yearSet.add(y); });
      const yearsList = [...yearSet].sort((a, b) => b - a);

      // Compute current & previous timeframe windows
      let curStart = "1900-01-01", curEnd = "2999-12-31", prevStart = null, prevEnd = null, periodTitle = tr("All-Time", "మొత్తం డేటా");
      if (analyticsUi.timeframe === "WEEK") {
        curStart = isoShiftDays(today, -6); curEnd = today;
        prevStart = isoShiftDays(today, -13); prevEnd = isoShiftDays(today, -7);
        periodTitle = tr("This Week vs Last Week", "ఈ వారం vs గత వారం");
      } else if (analyticsUi.timeframe === "MONTH") {
        const cm = monthBounds(curYear, curMonth);
        const pmDate = new Date(curYear, curMonth - 1, 1);
        const pm = monthBounds(pmDate.getFullYear(), pmDate.getMonth());
        curStart = cm.start; curEnd = cm.end;
        prevStart = pm.start; prevEnd = pm.end;
        periodTitle = tr("This Month vs Last Month", "ఈ నెల vs గత నెల");
      } else if (analyticsUi.timeframe === "LAST_3M") {
        const mStart = new Date(curYear, curMonth - 2, 1);
        curStart = monthBounds(mStart.getFullYear(), mStart.getMonth()).start;
        curEnd = monthBounds(curYear, curMonth).end;
        const pStart = new Date(curYear, curMonth - 5, 1);
        const pEnd = new Date(curYear, curMonth - 3, 1);
        prevStart = monthBounds(pStart.getFullYear(), pStart.getMonth()).start;
        prevEnd = monthBounds(pEnd.getFullYear(), pEnd.getMonth()).end;
        periodTitle = tr("Last 3 Months", "గత 3 నెలలు");
      } else if (analyticsUi.timeframe === "YEARLY") {
        curStart = `${analyticsUi.year}-01-01`; curEnd = `${analyticsUi.year}-12-31`;
        prevStart = `${analyticsUi.year - 1}-01-01`; prevEnd = `${analyticsUi.year - 1}-12-31`;
        periodTitle = `${analyticsUi.year} ${tr("Yearly", "వార్షిక")}`;
      }

      const inRange = (tx, sD, eD) => sD && eD && tx.date >= sD && tx.date <= eD;
      const curTxns = allTxns.filter(tx => inRange(tx, curStart, curEnd));
      const prevTxns = prevStart ? allTxns.filter(tx => inRange(tx, prevStart, prevEnd)) : [];

      const sumByType = (arr, tp) => arr.filter(x => x.type === tp).reduce((a, b) => a + b.amountPaise, 0);
      const curInc = sumByType(curTxns, "INCOME");
      const curExp = sumByType(curTxns, "EXPENSE");
      const curProf = curInc - curExp;
      const prevInc = sumByType(prevTxns, "INCOME");
      const prevExp = sumByType(prevTxns, "EXPENSE");
      const prevProf = prevInc - prevExp;

      const pctBadge = (curV, prevV, invertGood = false) => {
        if (!prevStart || prevV === 0) return `<span class="text-[10px] text-[#6e736a]">—</span>`;
        const pct = Math.round(((curV - prevV) / Math.abs(prevV)) * 100);
        const good = invertGood ? pct <= 0 : pct >= 0;
        return `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${good ? "bg-[#10b981]/20 text-[#15803d]" : "bg-[#dc2626]/20 text-[#b91c1c]"}">${pct >= 0 ? "+" : ""}${pct}%</span>`;
      };

      const groupCats = (arr, tp) => {
        const map = {};
        arr.filter(x => x.type === tp).forEach(x => {
          if (!map[x.category]) map[x.category] = { category: x.category, amountPaise: 0, isCustom: x.isCustom };
          map[x.category].amountPaise += x.amountPaise;
          if (x.isCustom) map[x.category].isCustom = true;
        });
        return Object.values(map).sort((a, b) => b.amountPaise - a.amountPaise);
      };

      const incBreakdown = groupCats(curTxns, "INCOME");
      const expBreakdown = groupCats(curTxns, "EXPENSE");
      const prevIncMap = {}; groupCats(prevTxns, "INCOME").forEach(x => { prevIncMap[x.category] = x.amountPaise; });
      const prevExpMap = {}; groupCats(prevTxns, "EXPENSE").forEach(x => { prevExpMap[x.category] = x.amountPaise; });

      // Period Comparison Series
      const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      let compSeries = [];
      if (analyticsUi.timeframe === "WEEK") {
        compSeries = [
          { label: tr("Last Week", "గత వారం"), income: prevInc, expense: prevExp, profit: prevProf },
          { label: tr("This Week", "ఈ వారం"), income: curInc, expense: curExp, profit: curProf }
        ];
      } else if (analyticsUi.timeframe === "MONTH") {
        compSeries = [
          { label: tr("Last Month", "గత నెల"), income: prevInc, expense: prevExp, profit: prevProf },
          { label: tr("This Month", "ఈ నెల"), income: curInc, expense: curExp, profit: curProf }
        ];
      } else if (analyticsUi.timeframe === "LAST_3M") {
        for (let k = 2; k >= 0; k--) {
          const d = new Date(curYear, curMonth - k, 1);
          const mb = monthBounds(d.getFullYear(), d.getMonth());
          const mt = allTxns.filter(tx => inRange(tx, mb.start, mb.end));
          const mi = sumByType(mt, "INCOME"), me = sumByType(mt, "EXPENSE");
          compSeries.push({ label: `${monthNames[d.getMonth()]} '${String(d.getFullYear()).slice(2)}`, income: mi, expense: me, profit: mi - me });
        }
      } else {
        compSeries = [
          { label: tr("Income", "ఆదాయం"), income: curInc, expense: 0, profit: curInc },
          { label: tr("Expense", "ఖర్చు"), income: 0, expense: curExp, profit: -curExp }
        ];
      }

      // Yearly Jan-Dec Series for analyticsUi.year
      const yearlySeries = monthNames.map((mn, mIdx) => {
        const mb = monthBounds(analyticsUi.year, mIdx);
        const mt = allTxns.filter(tx => inRange(tx, mb.start, mb.end));
        const mi = sumByType(mt, "INCOME"), me = sumByType(mt, "EXPENSE");
        return { label: mn, income: mi, expense: me, profit: mi - me };
      });

      const incPalette = ["#176b3a", "#2e8b57", "#0d9488", "#c69a45", "#2563eb", "#7a1f2b"];
      const expPalette = ["#dc2626", "#ef7624", "#7a1f2b", "#d97706", "#9333ea", "#0284c7"];

      const renderLedgerTable = (items, totalPaise, prevMap, isExpense) => {
        if (!items.length) return `<div class="text-xs text-[#6e736a] py-3">${tr("No entries in this timeframe.", "ఈ కాలంలో నమోదులు లేవు.")}</div>`;
        return `
          <div class="overflow-x-auto">
            <table class="w-full text-xs text-left">
              <thead>
                <tr class="text-[#6e736a] border-b border-[#eadfce]">
                  <th class="py-2 pr-2 font-semibold">${tr("Field", "విభాగం")}</th>
                  <th class="py-2 px-2 text-right font-semibold">${tr("Amount", "మొత్తం")}</th>
                  <th class="py-2 px-2 text-right font-semibold">${tr("Share", "శాతం")}</th>
                  <th class="py-2 pl-2 text-right font-semibold">${tr("vs Prev", "తేడా")}</th>
                </tr>
              </thead>
              <tbody>
                ${items.map(it => {
                  const pct = totalPaise > 0 ? ((it.amountPaise / totalPaise) * 100).toFixed(1) : "0.0";
                  const pv = prevMap[it.category] || 0;
                  const diff = it.amountPaise - pv;
                  const diffHtml = !prevStart ? `<span class="text-[#6e736a]">—</span>`
                    : diff === 0 ? `<span class="text-[#6e736a]">₹0</span>`
                    : `<span class="${(isExpense ? diff < 0 : diff > 0) ? "text-[#15803d]" : "text-[#b91c1c]"} font-bold">${diff > 0 ? "▲ +" : "▼ -"}${formatShortInr(Math.abs(diff))}</span>`;
                  return `
                    <tr class="border-b border-[#f3ece1]">
                      <td class="py-2 pr-2 text-[#26332b] font-medium">${escapeHtml(it.category)} ${it.isCustom ? `<span class="text-[9px] px-1 py-0.5 rounded bg-[#d97706]/20 text-[#b45309]">Custom</span>` : ""}</td>
                      <td class="py-2 px-2 text-right font-bold text-[#26332b]">${formatInr(it.amountPaise)}</td>
                      <td class="py-2 px-2 text-right text-[#6e736a]">${pct}%</td>
                      <td class="py-2 pl-2 text-right">${diffHtml}</td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
      };

      const tfPills = [
        { id: "WEEK", label: tr("Week", "వారం") },
        { id: "MONTH", label: tr("Month vs Last", "ఈ నెల vs గత నెల") },
        { id: "LAST_3M", label: tr("Last 3 Months", "గత 3 నెలలు") },
        { id: "YEARLY", label: tr("Yearly", "వార్షిక") },
        { id: "ALL", label: tr("All-Time", "మొత్తం") }
      ];

      return `
        <main class="px-4 sm:px-8 pt-5 pb-8 space-y-5 max-w-4xl mx-auto">
          <div class="flex items-center justify-between gap-2">
            <div><div class="text-xs uppercase tracking-[1.6px] font-extrabold text-[#176b3a]">DHAROHAR</div><h2 class="serif-title text-2xl font-bold mt-0.5">${escapeHtml(t("navReports"))} & ${tr("Analytics", "విశ్లేషణ")}</h2></div>
          </div>

          <!-- DARK ANALYTICS & DUAL-MODE GRAPHING DASHBOARD -->
          <section class="analytics-dark space-y-4">
            <!-- Top Filter Bar + 2-Mode Chart Switcher -->
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 flex-1">
                ${tfPills.map(p => `<button type="button" onclick="setAnalyticsOpt('timeframe', '${p.id}')" class="analytics-pill ${analyticsUi.timeframe === p.id ? "active" : ""}">${escapeHtml(p.label)}</button>`).join("")}
              </div>
              <div class="flex items-center gap-1 p-1 rounded-full bg-[#fff4e5] border border-[#eadfce] shrink-0">
                <button type="button" onclick="setAnalyticsOpt('chartMode', 'BAR')" class="px-3 py-1.5 rounded-full text-xs font-bold cursor-pointer border-0 ${analyticsUi.chartMode === "BAR" ? "bg-[#ef7624] text-white" : "bg-transparent text-[#6e736a]"}">📊 ${tr("Bar", "బార్")}</button>
                <button type="button" onclick="setAnalyticsOpt('chartMode', 'GRAPH')" class="px-3 py-1.5 rounded-full text-xs font-bold cursor-pointer border-0 ${analyticsUi.chartMode === "GRAPH" ? "bg-[#176b3a] text-white" : "bg-transparent text-[#6e736a]"}">📈 ${tr("Graph", "గ్రాఫ్")}</button>
              </div>
            </div>

            <!-- KPI Summary Strip -->
            <div class="grid grid-cols-3 gap-2.5">
              <div class="analytics-card p-3 space-y-1">
                <div class="text-[10px] uppercase tracking-wider text-[#6e736a] font-bold">${tr("Income", "ఆదాయం")}</div>
                <div class="text-sm sm:text-lg font-extrabold text-[#176b3a] truncate">${formatInr(curInc)}</div>
                <div>${pctBadge(curInc, prevInc, false)}</div>
              </div>
              <div class="analytics-card p-3 space-y-1">
                <div class="text-[10px] uppercase tracking-wider text-[#6e736a] font-bold">${tr("Expense", "ఖర్చు")}</div>
                <div class="text-sm sm:text-lg font-extrabold text-[#dc2626] truncate">${formatInr(curExp)}</div>
                <div>${pctBadge(curExp, prevExp, true)}</div>
              </div>
              <div class="analytics-card p-3 space-y-1">
                <div class="text-[10px] uppercase tracking-wider text-[#6e736a] font-bold">${tr("Net Profit", "నికర లాభం")}</div>
                <div class="text-sm sm:text-lg font-extrabold ${curProf >= 0 ? "text-[#15803d]" : "text-[#b91c1c]"} truncate">${formatInr(curProf)}</div>
                <div>${pctBadge(curProf, prevProf, false)}</div>
              </div>
            </div>

            <!-- 1. Where Money Comes From (Income Fields) -->
            <div class="analytics-card p-4 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <div class="text-xs font-bold text-[#176b3a] uppercase tracking-wider">${tr("Where Money Comes From", "ఆదాయ వనరులు")}</div>
                  <div class="text-[11px] text-[#6e736a]">${escapeHtml(periodTitle)} • ${incBreakdown.length ? `${tr("Top", "అత్యధికం")}: ${escapeHtml(incBreakdown[0].category)}` : tr("No income yet", "ఆదాయం లేదు")}</div>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-[#176b3a]/15 text-[#176b3a] font-bold">${analyticsUi.chartMode === "BAR" ? tr("Bar Mode", "బార్ మోడ్") : tr("Donut Mode", "డోనట్ మోడ్")}</span>
              </div>
              ${analyticsUi.chartMode === "BAR"
                ? renderRankedBars(incBreakdown, curInc, "#176b3a", "expandInc", analyticsUi.expandInc, tr("No income recorded in this period.", "ఈ కాలంలో ఆదాయం నమోదు కాలేదు."))
                : renderDonutSvg(incBreakdown, curInc, incPalette, analyticsUi.selIncIdx, "selIncIdx", tr("No income recorded in this period.", "ఈ కాలంలో ఆదాయం నమోదు కాలేదు."))}
            </div>

            <!-- 2. Where Money Goes (Expenditures + Custom Other Fields) -->
            <div class="analytics-card p-4 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <div class="text-xs font-bold text-[#dc2626] uppercase tracking-wider">${tr("Where Money Goes (incl. Custom Fields)", "ఖర్చు విభాగాలు (కస్టమ్‌తో సహా)")}</div>
                  <div class="text-[11px] text-[#6e736a]">${escapeHtml(periodTitle)} • ${expBreakdown.length ? `${tr("Top", "అత్యధికం")}: ${escapeHtml(expBreakdown[0].category)}` : tr("No expenses yet", "ఖర్చులు లేవు")}</div>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-[#dc2626]/15 text-[#b91c1c] font-bold">${analyticsUi.chartMode === "BAR" ? tr("Bar Mode", "బార్ మోడ్") : tr("Donut Mode", "డోనట్ మోడ్")}</span>
              </div>
              ${analyticsUi.chartMode === "BAR"
                ? renderRankedBars(expBreakdown, curExp, "#dc2626", "expandExp", analyticsUi.expandExp, tr("No expenses recorded in this period.", "ఈ కాలంలో ఖర్చులు నమోదు కాలేదు."))
                : renderDonutSvg(expBreakdown, curExp, expPalette, analyticsUi.selExpIdx, "selExpIdx", tr("No expenses recorded in this period.", "ఈ కాలంలో ఖర్చులు నమోదు కాలేదు."))}
            </div>

            <!-- 3. Period Comparison -->
            <div class="analytics-card p-4 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <div class="text-xs font-bold text-[#7a1f2b] uppercase tracking-wider">${tr("Period Comparison", "కాలాల పోలిక")}</div>
                  <div class="text-[11px] text-[#6e736a]">${escapeHtml(periodTitle)}</div>
                </div>
                <div class="flex items-center gap-3 text-[10px] font-bold">
                  <span class="text-[#176b3a]">● ${tr("Income", "ఆదాయం")}</span>
                  <span class="text-[#dc2626]">● ${tr("Expense", "ఖర్చు")}</span>
                </div>
              </div>
              ${renderComparisonSvg(compSeries, analyticsUi.chartMode, false)}
            </div>

            <!-- 4. Yearly Total & Profit Performance (Jan-Dec) -->
            <div class="analytics-card p-4 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div class="text-xs font-bold text-[#15803d] uppercase tracking-wider">${tr("Yearly Performance (Jan–Dec)", "వార్షిక పనితీరు (జన–డిసె)")}</div>
                  <div class="text-[11px] text-[#6e736a]">${tr("Income, Expense & Net Profit", "ఆదాయం, ఖర్చు & నికర లాభం")}</div>
                </div>
                <select onchange="setAnalyticsOpt('year', Number(this.value))" class="bg-[#fff9ef] text-[#26332b] text-xs font-bold border border-[#dfd3c3] rounded-lg px-2.5 py-1.5 cursor-pointer">
                  ${yearsList.map(y => `<option value="${y}" ${y === analyticsUi.year ? "selected" : ""}>${y}</option>`).join("")}
                </select>
              </div>
              <div class="flex items-center gap-3 text-[10px] font-bold">
                <span class="text-[#176b3a]">● ${tr("Income", "ఆదాయం")}</span>
                <span class="text-[#dc2626]">● ${tr("Expense", "ఖర్చు")}</span>
                <span class="text-[#15803d]">● ${tr("Net Profit", "నికర లాభం")}</span>
              </div>
              ${renderComparisonSvg(yearlySeries, analyticsUi.chartMode, true)}
            </div>

            <!-- Organized Data Ledger Below Charts -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div class="analytics-card p-4 space-y-2">
                <div class="text-xs font-bold text-[#176b3a] uppercase tracking-wider">${tr("Income Ledger", "ఆదాయ పట్టిక")} (${incBreakdown.length})</div>
                ${renderLedgerTable(incBreakdown, curInc, prevIncMap, false)}
              </div>
              <div class="analytics-card p-4 space-y-2">
                <div class="text-xs font-bold text-[#dc2626] uppercase tracking-wider">${tr("Expenditure Ledger", "ఖర్చుల పట్టిక")} (${expBreakdown.length})</div>
                ${renderLedgerTable(expBreakdown, curExp, prevExpMap, true)}
              </div>
            </div>
          </section>

          <!-- Consolidated Summary + Export Card -->
          <div class="heritage-card p-5 space-y-3">
            <div class="serif-title font-bold text-lg">${tr("Consolidated Financial Report", "సమగ్ర ఆర్థిక నివేదిక")}</div>
            <div class="flex justify-between text-sm py-1 border-b border-[#f3ece1]"><span>${escapeHtml(t("pandit"))} ${tr("Income", "ఆదాయం")}</span><strong>${formatInr(c.panditReceived)}</strong></div>
            <div class="flex justify-between text-sm py-1 border-b border-[#f3ece1]"><span>${escapeHtml(t("pendingDakshina"))}</span><strong class="text-[#ef7624]">${formatInr(c.pendingDakshina)}</strong></div>
            <div class="flex justify-between text-sm py-1 border-b border-[#f3ece1]"><span>${escapeHtml(t("agri"))} ${tr("Net Profit", "నికర లాభం")}</span><strong class="text-[#176b3a]">${formatInr(c.agriIncome - c.agriExpense)}</strong></div>
            <div class="flex justify-between text-sm py-1 border-b border-[#f3ece1]"><span>${tr("Pending Labour Wages", "బాకీ ఉన్న కూలీ వేతనాలు")}</span><strong class="text-[#ef7624]">${formatInr(c.agriWagesPending)}</strong></div>
            <div class="flex justify-between text-sm py-1 border-b border-[#f3ece1]"><span>${tr("Loan Interest Profit (Lent)", "అప్పుల వడ్డీ లాభం (ఇచ్చినవి)")}</span><strong class="text-[#176b3a]">${formatInr(c.loanProfitEarned)}</strong></div>
            <div class="flex justify-between text-sm py-1"><span>${escapeHtml(t("outstandingLoans"))}</span><strong>${formatInr(c.totalLoansOut)}</strong></div>
            <div class="flex flex-wrap gap-3 pt-3">
              <button type="button" onclick="exportCsvReport()" class="btn-green flex-1">${escapeHtml(t("exportCsv"))}</button>
              <button type="button" onclick="printReportPdf()" class="btn-primary flex-1">${escapeHtml(t("printPdf"))}</button>
            </div>
          </div>
        </main>`;
    }

    function printReportPdf() {
      const job = `DHAROHAR_Report_${todayIso()}`;
      if (window.AndroidBridge && window.AndroidBridge.printReportPdf) {
        window.AndroidBridge.printReportPdf(job);
        showToast(tr("Opening Android Print / Save as PDF...", "ఆండ్రాయిడ్ ప్రింట్ / PDF సేవ్ తెరుస్తోంది..."));
        return;
      }
      window.print();
    }

    function exportCsvReport() {
      const c = computeConsolidated();
      const rows = [
        ["Metric", "Amount_INR"],
        ["Total Income", formatInr(c.totalIncome)],
        ["Total Expenses", formatInr(c.totalExpenses)],
        ["Net Cash Flow", formatInr(c.netCashFlow)],
        ["POUROHITHYAM Received", formatInr(c.panditReceived)],
        ["Pending Dakshina", formatInr(c.pendingDakshina)],
        ["Agriculture Income", formatInr(c.agriIncome)],
        ["Agriculture Expenses (incl. Paid Wages)", formatInr(c.agriExpense)],
        ["Pending Labour Wages", formatInr(c.agriWagesPending)],
        ["Loan Interest Profit (Lent)", formatInr(c.loanProfitEarned)],
        ["Borrowed Outstanding", formatInr(c.borrowedOut)],
        ["Lent Outstanding", formatInr(c.lentOut)]
      ];
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
      const fname = `dharohar_report_${todayIso()}.csv`;
      if (window.AndroidBridge && window.AndroidBridge.downloadFileToDownloads) {
        window.AndroidBridge.downloadFileToDownloads(fname, "text/csv", csv);
        showToast(tr(`Saved to Downloads/${fname}`, `Downloads/${fname} లో సేవ్ అయింది`));
        return;
      }
      if (window.AndroidBridge && window.AndroidBridge.shareExportFile) {
        window.AndroidBridge.shareExportFile(fname, "text/csv", csv);
        showToast("Opening Android share/save for CSV report");
        return;
      }
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = fname; a.style.display = "none";
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      showToast("CSV report downloaded");
    }

      return `
        <main class="px-4 sm:px-8 pt-6 pb-8 space-y-5 max-w-2xl">
          <div><div class="text-xs uppercase tracking-[1.6px] font-extrabold text-[#176b3a]">DHAROHAR</div><h2 class="serif-title text-2xl font-bold mt-0.5">${escapeHtml(t("navSettings"))}</h2></div>

          <div class="heritage-card p-5 space-y-3 border-l-4 border-l-[#176b3a]">

    function exportJsonBackup(prefix = "dharohar_backup") {
      const content = JSON.stringify(state, null, 2);
      const fname = `${prefix}_${todayIso()}.json`;
      if (window.AndroidBridge && window.AndroidBridge.downloadJsonToDownloads) {
        window.AndroidBridge.downloadJsonToDownloads(fname, content);
        showToast(tr(`Saved to Downloads/${fname}`, `Downloads/${fname} లో సేవ్ అయింది`));
        return;
      }
      if (window.AndroidBridge && window.AndroidBridge.shareExportFile) {
        window.AndroidBridge.shareExportFile(fname, "application/json", content);
        showToast("Opening Android share/save for JSON backup");
        return;
      }
      const blob = new Blob([content], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fname;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1500);
      showToast("Backup JSON file downloaded safely");
    }

    function handleRestoreBackup(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.bookings)) {
            return showToast("Invalid DHAROHAR backup file.");
          }
          state = Object.assign(defaultState(), parsed);
          saveState();
          goHome();
          showToast("Family records restored safely!");
        } catch (e) {
          showToast("Could not read backup file.");
        }
      };
      reader.readAsText(file);
    }

              window.__pendingExcessInterestCommit = commitRepay;
              const warnHtml = `
                <div class="space-y-4">

          saveState();
          uploadBackupToGoogleDrive();
        });

      if (byId("gmail-form")) {
        byId("gmail-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const email = (new FormData(e.target).get("gmail") || "").trim().toLowerCase();
          if (!email.endsWith("@gmail.com")) {
            return showToast("Only @gmail.com addresses are allowed for Gmail Backup.");
          }
          state.gmailBackupEmail = email;
          state.lastGmailBackupAt = new Date().toLocaleString("en-IN");
          saveState();
          if (window.AndroidBridge && window.AndroidBridge.sendGmailBackup) {
            window.AndroidBridge.sendGmailBackup(email, JSON.stringify(state, null, 2));
            render();
            showToast("Opening Gmail with backup file attached!");
            return;
          }
          exportJsonBackup("dharohar_gmail_backup");
          const c = computeConsolidated();
          const subject = encodeURIComponent(`DHAROHAR Family Backup — ${todayIso()}`);
          const body = encodeURIComponent(
            `Namaste,\n\nAttached is your DHAROHAR family backup file (dharohar_gmail_backup_${todayIso()}.json).\n\nSummary:\n- Total Income: ${formatInr(c.totalIncome)}\n- Total Expenses: ${formatInr(c.totalExpenses)}\n- Pending Dakshina: ${formatInr(c.pendingDakshina)}\n- Pending Labour Wages: ${formatInr(c.agriWagesPending)}\n- Outstanding Loans: ${formatInr(c.totalLoansOut)}\n\nPlease attach the downloaded JSON file to this email and send to yourself so your data stays safe in Gmail even if your phone is lost.`

      if (byId("edit-loan-repay-form")) {
        byId("edit-loan-repay-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const r = state.loanRepayments.find(x => x.id === e.target.dataset.id);
          if (!r) return;
          const l = state.loans.find(x => x.id === r.loanId);
          const fd = new FormData(e.target);
          const paise = rupeesToPaise(fd.get("amount"));
          const pDate = fd.get("date");
          if (isNaN(paise) || paise <= 0) return showToast(tr("Enter valid amount", "సరైన మొత్తం నమోదు చేయండి"));
          if (l && l.startDate) {
            const err = validateTimeline(l.startDate, pDate, "Loan Start Date", "Payment Date");
            if (err) return showToast(err);
          }
          const pType = fd.get("paymentType");
          if (l) {
            const otherCalc = calcLoanSummary(l, state.loanRepayments.filter(x => x.id !== r.id));
            if (pType === "PRINCIPAL" && paise > otherCalc.outPrincipalPaise) {
              return showToast(tr(`⚠️ Cannot pay more than remaining Principal (${formatInr(otherCalc.outPrincipalPaise)})!`, `⚠️ మిగిలిన అసలు (${formatInr(otherCalc.outPrincipalPaise)}) కంటే ఎక్కువ చెల్లించలేరు!`));
            }
            if (pType === "INTEREST" && paise > otherCalc.totalOutPaise) {
              return showToast(tr(`⚠️ Cannot exceed total remaining balance (${formatInr(otherCalc.totalOutPaise)})!`, `⚠️ మొత్తం మిగిలిన బాకీ (${formatInr(otherCalc.totalOutPaise)}) కంటే ఎక్కువ చెల్లించలేరు!`));
            }
          }
          const redPrin = pType === "PRINCIPAL" ? (fd.get("reducePrincipal") === "YES") : false;
          const updated = { paymentType: pType, reducePrincipal: redPrin, amountPaise: paise, method: fd.get("method"), date: pDate, note: (fd.get("note") || "").trim() };
          requestProtectedEdit(tr(`Loan Payment (${formatInr(paise)})`, `అప్పు చెల్లింపు (${formatInr(paise)})`), () => {
            Object.assign(r, updated);
            saveState();
            render();
            showToast(tr("Loan payment updated", "అప్పు చెల్లింపు అప్‌డేట్ అయింది"));
          });
        });
      }

    ];

    function applyTeluguDomPass(rootEl) {
      if (state.lang !== "te" || !rootEl) return;
      const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const raw = node.nodeValue;
        if (!raw || !raw.trim()) continue;
        const trimmed = raw.trim();
        if (TE_EXACT[trimmed]) {
          node.nodeValue = raw.replace(trimmed, TE_EXACT[trimmed]);
          continue;
        }
        let updated = raw;
        for (const [enPart, tePart] of TE_PARTIALS) {
          if (updated.includes(enPart)) updated = updated.replace(enPart, tePart);
        }
        if (updated !== raw) node.nodeValue = updated;
      }
      rootEl.querySelectorAll("option").forEach(opt => {
        const txt = (opt.textContent || "").trim();
        if (TE_EXACT[txt]) opt.textContent = TE_EXACT[txt];
      });
    }

    function render() {
      const appEl = document.getElementById("app");
      const c = computeConsolidated();
      const { view, params } = currentRoute();
      let body = "";
      if (view === "home") body = renderHome(c);
      else if (view === "pandit") body = renderPandit(c);
      else if (view === "pandit_new_booking") body = renderPanditNewBooking();
      else if (view === "pandit_edit_booking") body = renderPanditEditBooking(params.id);
      else if (view === "pandit_add_payment") body = renderPanditAddPayment(params.id);
      else if (view === "pandit_postpone") body = renderPanditPostpone(params.id);
      else if (view === "agriculture") body = renderAgriculture(c);
      else if (view === "crop_detail") body = renderCropDetailScreen(params.id, c);
      else if (view === "worker_profile") body = renderWorkerProfileScreen(params.name, c);
      else if (view === "agri_new_crop") body = renderAgriNewCrop();
      else if (view === "agri_edit_crop") body = renderAgriEditCrop(params.id);
      else if (view === "agri_add_expense") body = renderAgriAddExpense(params.cycleId);
      else if (view === "agri_edit_expense") body = renderAgriEditExpense(params.id);
      else if (view === "agri_add_sale") body = renderAgriAddSale(params.cycleId);
      else if (view === "agri_new_wage") body = renderAgriNewWage(params || {});
      else if (view === "agri_edit_wage") body = renderAgriEditWage(params.id);
      else if (view === "agri_pay_wage") body = renderAgriPayWage(params.id);
      else if (view === "personal") body = renderPersonal(c);
      else if (view === "personal_new") body = renderPersonalNew();
      else if (view === "personal_edit") body = renderPersonalEdit(params.id);
      else if (view === "personal_budget") body = renderPersonalBudget();
      else if (view === "loans") body = renderLoans(c);
      else if (view === "loan_new") body = renderLoanNew();
      else if (view === "loan_edit") body = renderLoanEdit(params.id);
      else if (view === "loan_repay") body = renderLoanRepay(params.id);
      else if (view === "loan_detail") body = renderLoanDetailScreen(params.id);
      else if (view === "family_overview") body = renderFamilyOverview(c);
      else if (view === "transfer_new") body = renderTransferNew();
      else if (view === "reminders") body = renderReminders(c);
      else if (view === "reports") body = renderReports(c);
      else if (view === "settings") body = renderSettings();
      else if (view === "member_new") body = renderMemberNew();
      else if (view === "confirm_edit_step1") body = renderConfirmEditStep1(params.summaryText);
      else if (view === "confirm_edit_step2") body = renderConfirmEditStep2(params.summaryText);

      appEl.innerHTML = renderHeader() + body + renderBottomNav();
      applyTeluguDomPass(appEl);
      attachFormListeners();
    }

    render();

    window.handleAndroidBack = function() {
      const modalRoot = document.getElementById("modal-root");
      if (modalRoot && modalRoot.innerHTML.trim() !== "") {
        closeModal();
        render();
        return true;
      }
      if (navStack.length > 1) {
        navStack.pop();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return true;
      }
      if (currentRoute().view !== "home") {
        goHome();
        return true;
      }
      return false;
    };

    (function hideSplashCleanly() {
      const sp = document.getElementById("splash-screen");
      if (!sp) return;
      setTimeout(function() {
        sp.classList.add("fade-out");
        setTimeout(function() { sp.style.display = "none"; }, 420);
      }, 1800);
    })();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {});
      });
    }
  </script>
